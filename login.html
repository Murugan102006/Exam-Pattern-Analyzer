<!DOCTYPE html>
<html>
    <head>
        
        <title>login page</title>
        <style>
        body{
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
    
              }
          .login-container {
            background: #f0f0f0;
            padding: 30px 40px;
            border-radius: 10px;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        .login-container label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        .login-container input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #2b1c1c;
            border-radius: 5px;
            font-size: 14px;
        }
        .login-container button {
            width: 100%;
            padding: 10px;
            background: #667eea;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .login-container .footer {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }
        </style>
    </head>
    <body>
        <div class="login-container">
            <form>
                    <h2>LOGIN</h2>
                     <lable>USER NAME: <input type="text" placeholder="enter user name" required> </lable><br><br>
                     <lable>PASSWORD: <input type=""password placeholder="enter password" required></lable><br><br>
                     <button type="submit">LOGIN</button>
                    
            </form>
            
        <div class="footer">
                  <p>Don't have account? <a href="#">sign up</a></p>
        </div>
    </div>
    </body>
</html>
