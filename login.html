<!DOCTYPE html>
<html>
    <head>
        
        <title>login page</title>
        <style>
        body{
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
    
              }
          .login-container {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 100px;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        .login-container label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        .login-container input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #110f0f;
            border-radius: 50px;
            font-size: 14px;
        }
        .login-container button {
            width: 100%;
            padding: 10px;
            background: #3daf6c;
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .login-container .footer {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }
        </style>
    </head>
    <body>
        <div class="login-container">
    <form method="POST" action="/login">
        <h2>LOGIN</h2>
    <label>Username:</label>
    <input type="text" name="username" required><br><br>

    <label>Password:</label>
    <input type="password" name="password" required><br><br>

    <button type="submit">Login</button>
</form>
            
        <div class="footer">
                  <p>Don't have account? <a href="signup.html">sign up</a></p>

        </div>

    </div>
    <script>
        function validationlogin(){
            let user=document.getElementById("user").value;
            let pass=document.getElementById("pass").value;
            if(user==""){
                alert("User name is requried");
                console.log("User name is requried");
                return false;
            }
            if(pass==""){
                alert("pass is required");
                return false;
            }
            alert("login successfully");
            return true;
        }
    </script>
    </body>
</html>
